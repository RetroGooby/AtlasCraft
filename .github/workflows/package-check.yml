name: Windows Preview Package Check

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: ID of the draft prerelease whose ZIP should be checked
        required: true
        type: string

permissions:
  # Reading an unpublished draft release requires push-equivalent access.
  # The token is removed from the environment before the application executes.
  contents: write

jobs:
  package-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Verify and run the packaged application without installing dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_ID -notmatch '^\d+$') { throw 'Invalid release ID' }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/releases/$env:RELEASE_ID"
          if (-not $release.prerelease) { throw 'Only prerelease assets may be tested' }
          $zips = @($release.assets | Where-Object { $_.name -match '^AtlasWorldsMinecraft-.*-windows-x64\.zip$' })
          $sums = @($release.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' })
          if ($zips.Count -ne 1 -or $sums.Count -ne 1) { throw 'Expected one application ZIP and one checksum file' }
          $work = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          $headers.Accept = 'application/octet-stream'
          $zipPath = Join-Path $work $zips[0].name
          $sumPath = Join-Path $work 'SHA256SUMS.txt'
          Invoke-WebRequest -Headers $headers -Uri $zips[0].url -OutFile $zipPath
          Invoke-WebRequest -Headers $headers -Uri $sums[0].url -OutFile $sumPath
          $lines = @(Get-Content -LiteralPath $sumPath | Where-Object { $_.EndsWith('  ' + $zips[0].name) })
          if ($lines.Count -ne 1 -or $lines[0] -notmatch '^([0-9a-f]{64})  ') { throw 'Invalid checksum entry' }
          $expected = $Matches[1]
          $digest = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $expected) { throw 'Application ZIP checksum mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            foreach ($entry in $archive.Entries) {
              if (-not $entry.FullName.StartsWith('AtlasWorldsMinecraft/') -or
                  $entry.FullName.Contains('\') -or $entry.FullName -match '(^|/)\.\.(/|$)' -or
                  (($entry.ExternalAttributes -shr 16) -band 61440) -eq 40960) {
                throw 'Unsafe archive entry'
              }
            }
          } finally { $archive.Dispose() }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $work
          $app = Join-Path $work 'AtlasWorldsMinecraft'
          $manifest = Get-Content -LiteralPath (Join-Path $app 'release-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.edition -ne 'minecraft' -or $manifest.private_configuration_included) { throw 'Invalid edition manifest' }
          $entries = @($manifest.files.PSObject.Properties)
          $actual = @(Get-ChildItem -LiteralPath $app -Recurse -File -Force)
          if ($actual.Count -ne $entries.Count + 1) { throw 'Manifest membership mismatch' }
          foreach ($entry in $entries) {
            $path = [System.IO.Path]::GetFullPath((Join-Path $app $entry.Name))
            if (-not $path.StartsWith($app + '\', [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe manifest path' }
            if ((Get-Item -LiteralPath $path).Length -ne $entry.Value.size -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value.sha256) {
              throw 'Packaged file failed integrity verification'
            }
          }
          $headers = $null
          Remove-Item Env:GH_TOKEN,Env:PYTHONPATH,Env:PYTHONHOME -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:LOCALAPPDATA = Join-Path $work 'empty-local-data'
          $env:APPDATA = Join-Path $work 'empty-roaming-data'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA,$env:APPDATA | Out-Null
          $reportPath = Join-Path $work 'package-check.json'
          $process = Start-Process -FilePath (Join-Path $app 'AtlasWorldsMinecraft.exe') -ArgumentList @('--package-check', "`"$reportPath`"") -WorkingDirectory $work -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill($true); throw 'Packaged application timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $reportPath)) { throw 'Packaged application check failed' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.frozen -or $report.version -ne $manifest.version) { throw 'Invalid package-check result' }
          if (@($report.checks.PSObject.Properties | Where-Object { $_.Value -ne $true }).Count) { throw 'An offline check did not pass' }
          Write-Output "Verified ZIP SHA-256: $digest"
          Write-Output "Verified release ID: $env:RELEASE_ID"
          $report | ConvertTo-Json -Depth 5
